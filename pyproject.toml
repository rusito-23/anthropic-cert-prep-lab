[project]
name = "anthropic-cert-prep-lab"
version = "0.1.0"
description = "Hands-on exercises for Anthropic certification prep"
authors = [
    { name = "Igor Andruskiewitsch", email = "i.andruskiewitsch23@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "mcp",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "mcp[cli]>=2.2.0",
    "pre-commit>=4.6.2",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modern syntax)
    "B",   # flake8-bugbear (common bug patterns)
    "SIM", # flake8-simplify
]

[tool.ruff.format]
quote-style = "double"
